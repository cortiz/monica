# Release config: `goreleaser release --clean` (CI runs it on every pushed tag,
# see .github/workflows/release.yml). Check it locally with
# `goreleaser check` and `goreleaser release --snapshot --clean`.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: monica

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: monica
    main: .
    binary: monica
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X jmpeax.com/sec/monica/internal/version.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: darwin
        goarch: riscv64

archives:
  - formats: [tar.gz]
    # OS and arch names compatible with `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - Readme.md
      - LICENSE.md
      - examples/**/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
