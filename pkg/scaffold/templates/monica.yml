# Monica config: settings and variables shared by the .mon files in this folder
# and below. See https://github.com/cortiz/monica#configuration
version: 1
defaults:
  timeout: 30s
  headers:
    Accept: application/json
  vars:
    baseUrl: {{baseUrl}}
envs:
  dev:
    vars:
      baseUrl: {{baseUrl}}
